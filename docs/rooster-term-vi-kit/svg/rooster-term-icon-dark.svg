  <polygon points="224,132 308,184 266,184" fill="#FF8E2B"/>
  <polygon points="292,152 332,222 266,184" fill="#FFB800"/>
  <!-- Geometric Head & Neck -->
  <polygon points="222,226 266,184 316,246 196,356 156,346" fill="url(#bodyGrad)"/>
  <polygon points="266,184 316,246 278,392 196,356" fill="#232B3B"/>
  <!-- Eye Highlight -->
  <polygon points="274,202 318,228 310,244" fill="#FFB800"/>
  <!-- Beak -->
